name: Build Newflasher Windows Exe

on:
  workflow_dispatch: # Allows you to run the build manually

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4.2.2

    - name: Install MinGW Cross-Compiler, Libraries & Utilities
      run: |
        sudo apt-get update
        sudo apt-get install -y mingw-w64 libexpat1-dev libz-dev xxd wget mtools

    - name: Fix Makefile Links and Compile
      run: |
        # Create required folder layout
        mkdir -p include
        
        # Download the GordonGate Windows drivers manually so the Makefile doesn't crash on it
        wget -q "https://archive.org" -O Sony_Mobile_Software_Update_Drivers_x64_Setup.msi || true
        
        # Manually invoke the exact cross-compiler using pre-installed system packages, bypassing automated internal library builds
        x86_64-w64-mingw32-gcc -O2 -Wall newflasher.c -o newflasher.exe -lsetupapi -lwinusb -lexpat -lz

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4.4.3
      with:
        name: newflasher-v60-windows
        path: newflasher.exe
