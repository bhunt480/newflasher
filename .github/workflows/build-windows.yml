name: Build Newflasher Windows Exe

on:
  workflow_dispatch: # Allows you to run the build manually

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4.2.2

    - name: Install MinGW Cross-Compiler, Libraries & Utilities
      run: |
        sudo apt-get update
        sudo apt-get install -y mingw-w64 libexpat1-dev libz-dev xxd wget mtools

    - name: Generate Drivers, Align Headers, and Compile Standalone Exe
      run: |
        # Create the inclusion structure folder
        mkdir -p include
        
        # Download official Sony flash driver required by the codebase
        wget -q "https://sonymobile.com" -O GordonGate || true
        
        # Handle GordonGate driver hex translation
        if [ -f GordonGate ]; then
          echo "Driver download successful. Building GordonGate.h..."
          xxd -i GordonGate > include/GordonGate.h
        else
          echo "Driver download failed. Creating empty mock fallback header..."
          echo "unsigned char GordonGate[] = {0x00}; unsigned int GordonGate_len = 1;" > include/GordonGate.h
        fi
        
        # Move system-level expat and zlib header dependencies into our build scope
        cp /usr/include/expat.h include/
        cp /usr/include/zlib.h include/
        cp /usr/include/zconf.h include/
        
        # Execute cross-compilation with strict standalone static linking flags
        x86_64-w64-mingw32-gcc -O2 -Wall -static -I include newflasher.c -o newflasher.exe -lsetupapi -lwinusb -lexpat -lz

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4.4.3
      with:
        name: newflasher-v60-windows
        path: newflasher.exe
