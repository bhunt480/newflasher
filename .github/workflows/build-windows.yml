name: Build Newflasher Windows Exe

on:
  workflow_dispatch: # Allows you to run the build manually

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4.2.2

    - name: Install MinGW Cross-Compiler, Libraries & Utilities
      run: |
        sudo apt-get update
        sudo apt-get install -y mingw-w64 libexpat1-dev libz-dev xxd wget mtools

    - name: Compile Windows Executable via Makefile
      run: |
        # Create the folder where the makefile tries to place GordonGate.h
        mkdir -p include
        
        # Execute the specific windows make target provided by the developer
        make newflasher.exe CCWIN=x86_64-w64-mingw32-gcc WINDRES=x86_64-w64-mingw32-windres CCWINSTRIP=x86_64-w64-mingw32-strip CROSS_CFLAGS="-O2"

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4.4.3
      with:
        name: newflasher-v60-windows
        path: newflasher.exe
